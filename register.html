<!DOCTYPE html>
<html>
<head>
  <title>Register | CampusBuddies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="center">

<div class="box">
  <h3>Create Account</h3>

  <input type="file" id="profilePic">
  <input id="name" placeholder="Full Name">
  <input id="studentId" placeholder="Student ID">
  <input type="date" id="dob">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="register()">Register</button>
  <a href="index.html">Back to login</a>
</div>

<script>
function register() {
  const name = document.getElementById("name").value.trim();
  const studentId = document.getElementById("studentId").value.trim();
  const dob = document.getElementById("dob").value;
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const profilePicInput = document.getElementById("profilePic");

  if(!name || !studentId || !dob || !email || !password){
    alert("Please fill all fields!");
    return;
  }

  let profilePicURL = "";
  if(profilePicInput.files.length > 0){
    const reader = new FileReader();
    reader.onload = function() {
      profilePicURL = reader.result;
      saveUser();
    };
    reader.readAsDataURL(profilePicInput.files[0]);
  } else {
    saveUser();
  }

  function saveUser(){
    let users = JSON.parse(localStorage.getItem("users")) || [];
    if(users.some(u => u.studentId === studentId)){
      alert("Student ID already registered!");
      return;
    }

    users.push({ name, studentId, dob, email, password, profilePicURL });
    localStorage.setItem("users", JSON.stringify(users));

    alert("Registration successful! Please log in.");
    window.location.href = "index.html";
  }
}
</script>
</body>
</html>
